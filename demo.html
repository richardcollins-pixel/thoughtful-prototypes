<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>T — Leave it with T</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #1F0E41; position: fixed; width: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; align-items: center; justify-content: center; }
    #phone-wrapper { width: 430px; height: 956px; transform-origin: center; }
    .phone { width: 430px; height: 956px; background: #1F0E41; border-radius: 52px; overflow: hidden; position: relative; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 50px 120px rgba(0,0,0,0.9); }
    #app { position: absolute; inset: 0; }
    @media (max-width: 500px) {
      html, body { height: 100dvh; }
      body { align-items: stretch; }
      #phone-wrapper { width: 100vw !important; height: 100dvh !important; transform: none !important; margin: 0 !important; }
      .phone { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; box-shadow: none !important; }
    }

    /* ── Onboarding screen ── */
    #ob-screen {
      position: absolute; inset: 0; background: #1F0E41;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-start; padding: 80px 32px 44px; overflow: hidden;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #ob-screen.out { opacity: 0; transform: translateY(-16px); pointer-events: none; }
    .ob-glow-wrap {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      width: 460px; height: 460px; pointer-events: none; z-index: 0;
    }
    .ob-glow-wrap canvas { display: block; width: 100%; height: 100%;
      filter: blur(90px); -webkit-filter: blur(90px); opacity: 0.6; }
    .ob-blob-wrap { width: 140px; height: 140px; margin-bottom: 32px; flex-shrink: 0; position: relative; z-index: 1; }
    .ob-blob-canvas { width: 140px; height: 140px; border-radius: 50%; display: block; }
    .ob-title { position: relative; z-index: 1; }
    .ob-sub  { position: relative; z-index: 1; }
    .ob-title { color: #fff; font-size: 32px; font-weight: 600; text-align: center; margin-bottom: 10px; letter-spacing: -0.3px; }
    .ob-sub { color: rgba(255,255,255,0.50); font-size: 15px; text-align: center; line-height: 1.55; margin-bottom: 32px; max-width: 280px; }
    .ob-input {
      width: 100%; padding: 15px 18px; border-radius: 16px;
      background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14);
      color: #fff; font-size: 16px; font-family: inherit; outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s, background 0.2s;
    }
    .ob-input::placeholder { color: rgba(255,255,255,0.30); }
    .ob-input:focus { border-color: rgba(255,255,255,0.32); background: rgba(255,255,255,0.12); }
    .ob-btn {
      width: 100%; margin-top: 8px; padding: 17px; border-radius: 28px;
      background: #fff; border: none; color: #1F0E41;
      font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: opacity 0.2s;
    }
    .ob-btn:active { opacity: 0.82; }

    /* ── Loading screen ── */
    #ld-screen {
      position: absolute; inset: 0; background: #1F0E41;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 28px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #ld-screen.active { opacity: 1; pointer-events: auto; }
    .ld-blob-wrap { width: 140px; height: 140px; }
    .ld-blob-canvas { width: 140px; height: 140px; border-radius: 50%; display: block; }
    .ld-text { color: rgba(255,255,255,0.50); font-size: 16px; }
  </style>
</head>
<body>
  <div id="phone-wrapper">
    <div class="phone">
      <div id="app">
        <!-- Onboarding -->
        <div id="ob-screen">
          <div class="ob-glow-wrap"><canvas id="ob-glow"></canvas></div>
          <div class="ob-blob-wrap"><canvas class="ob-blob-canvas" id="ob-blob"></canvas></div>
          <p class="ob-title">Hi, I'm T</p>
          <p class="ob-sub">Let's get to know each other. This is just a demo to show you what I can do.</p>
          <input class="ob-input" id="ob-name" type="text" placeholder="Enter Name" autocomplete="given-name">
          <input class="ob-input" id="ob-email" type="email" placeholder="Enter Email" autocomplete="email">
          <button class="ob-btn" id="ob-btn">Try a demo</button>
        </div>
        <!-- Loading -->
        <div id="ld-screen">
          <div class="ld-blob-wrap"><canvas class="ld-blob-canvas" id="ld-blob"></canvas></div>
          <p class="ld-text" id="ld-text">Getting things ready…</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FETCH_CONFIG_URL = 'https://eogxbz3p54s5vng.m.pipedream.net';

    /* ── Phone scaling ── */
    function scalePhone() {
      const s = Math.min(window.innerWidth / 430, window.innerHeight / 956, 1);
      const w = document.getElementById('phone-wrapper');
      w.style.transform = `scale(${s})`;
      w.style.margin = `${(956 * s - 956) / 2}px ${(430 * s - 430) / 2}px`;
    }
    scalePhone();
    window.addEventListener('resize', scalePhone);

    /* ── TAvatar: cycling 3-preset blob animation ── */
    window.TAvatar = (function () {
      function hexRgb(h) {
        return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
      }
      function lerpColor(a, b, t) {
        const [ar,ag,ab] = hexRgb(a), [br,bg,bb] = hexRgb(b);
        return '#' + [ar+(br-ar)*t, ag+(bg-ag)*t, ab+(bb-ab)*t]
          .map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
      }
      function lerpPreset(p1, p2, t) {
        return {
          base: lerpColor(p1.base, p2.base, t),
          spots: p1.spots.map((s, i) => {
            const s2 = p2.spots[i] || s;
            return { angle: s.angle+(s2.angle-s.angle)*t, r: s.r+(s2.r-s.r)*t,
                     color: lerpColor(s.color, s2.color, t), opacity: s.opacity+(s2.opacity-s.opacity)*t };
          })
        };
      }
      function paintGradient(ctx, preset, W, H, orbit) {
        const CX=W/2, CY=H/2, R=Math.min(W,H)*0.37;
        const [br,bg,bb] = hexRgb(preset.base);
        ctx.fillStyle='rgb('+br+','+bg+','+bb+')'; ctx.fillRect(0,0,W,H);
        preset.spots.forEach(s => {
          const a=s.angle+orbit, sx=CX+Math.cos(a)*R, sy=CY+Math.sin(a)*R, sr=s.r*R;
          const [r,g,b]=hexRgb(s.color);
          const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
          grd.addColorStop(0,'rgba('+r+','+g+','+b+','+s.opacity+')');
          grd.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
          ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
        });
      }
      function paintGlow(ctx, preset, W, H, orbit) {
        ctx.clearRect(0,0,W,H);
        const CX=W/2, CY=H/2, HALF=Math.min(W,H)/2;
        preset.spots.forEach(s => {
          const a=s.angle+orbit;
          const sx=CX+Math.cos(a)*HALF*0.22, sy=CY+Math.sin(a)*HALF*0.22, sr=HALF*0.68;
          const [r,g,b]=hexRgb(s.color);
          const bright=Math.min(1,s.opacity*1.4);
          const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
          grd.addColorStop(0,'rgba('+r+','+g+','+b+','+bright+')');
          grd.addColorStop(0.75,'rgba('+r+','+g+','+b+','+(s.opacity*0.38)+')');
          grd.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
          ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
        });
      }
      function makeBlobPath(cx, cy, r, t) {
        const steps=120, pts=[];
        for (let i=0; i<steps; i++) {
          const a=(i/steps)*Math.PI*2;
          const w=1+0.10*Math.sin(2*a+t*1.4)+0.07*Math.cos(3*a-t);
          pts.push([cx+Math.cos(a)*r*w, cy+Math.sin(a)*r*w]);
        }
        const path=new Path2D();
        path.moveTo((pts[0][0]+pts[steps-1][0])/2,(pts[0][1]+pts[steps-1][1])/2);
        for (let i=0; i<steps; i++) {
          const c=pts[i], n=pts[(i+1)%steps];
          path.quadraticCurveTo(c[0],c[1],(c[0]+n[0])/2,(c[1]+n[1])/2);
        }
        path.closePath(); return path;
      }

      const ROSE={name:'Rose',base:'#591E9A',spots:[{angle:Math.PI*0.75,r:1.8,color:'#F57F70',opacity:1.0},{angle:Math.PI*0.60,r:1.4,color:'#683A94',opacity:0.85}]};
      const WARM={name:'Warm',base:'#3F0786',spots:[{angle:Math.PI*0.75,r:1.8,color:'#F57F70',opacity:1.0},{angle:Math.PI*0.60,r:1.4,color:'#852A9C',opacity:0.85}]};
      const COOL={name:'Cool',base:'#3F0786',spots:[{angle:Math.PI*0.75,r:1.8,color:'#2CC5E9',opacity:1.0},{angle:Math.PI*0.60,r:1.4,color:'#591E9A',opacity:0.7}]};
      const CYCLE=[ROSE,WARM,COOL];

      let blobEl=null, blobCtx=null, BW=0;
      let ambientEl=null, ambientCtx=null, AW=0, AH=0;
      let fromP=ROSE, toP=ROSE, fadeT=1, fadeDur=800;
      let orbit=0, lastTs=0, rafId=null, cycleTimer=null, cycleIdx=0;

      function draw(ts) {
        rafId=requestAnimationFrame(draw);
        if (!blobEl) return;
        const dt=Math.min(ts-lastTs,50); lastTs=ts;
        orbit+=dt*0.00035;
        if (fadeT<1) fadeT=Math.min(1,fadeT+dt/fadeDur);
        const p=fadeT>=1?toP:lerpPreset(fromP,toP,fadeT);
        if (fadeT>=1) fromP=toP;
        const bounceY=(Math.sin(ts*0.0008)*2).toFixed(1);
        blobEl.style.transform='translateY('+bounceY+'px)';
        blobCtx.clearRect(0,0,BW,BW);
        blobCtx.save(); blobCtx.clip(makeBlobPath(BW/2,BW/2,BW*0.43,orbit));
        paintGradient(blobCtx,p,BW,BW,orbit); blobCtx.restore();
        if (ambientEl && ambientCtx) paintGlow(ambientCtx,p,AW,AH,orbit);
      }

      return {
        COOL, WARM, ROSE,
        /* Mount the blob canvas. opts.noGlow=true skips auto-glow creation. */
        mount(el, opts) {
          blobEl=el;
          const dpr=Math.min(window.devicePixelRatio||1,2);
          BW=Math.round((el.offsetWidth||el.clientWidth||140)*dpr);
          el.width=el.height=BW; blobCtx=el.getContext('2d');
          if (rafId) cancelAnimationFrame(rafId); lastTs=0;
          rafId=requestAnimationFrame(ts=>{lastTs=ts;draw(ts);});
          if (cycleTimer) clearInterval(cycleTimer);
          cycleIdx=CYCLE.indexOf(toP); if(cycleIdx<0) cycleIdx=0;
          cycleTimer=setInterval(()=>{
            cycleIdx=(cycleIdx+1)%CYCLE.length;
            window.TAvatar.setPreset(CYCLE[cycleIdx],4500);
          },5000);
        },
        /* Mount a separate canvas for ambient glow (e.g. home glow-wrap, chat bottom glow). */
        mountAmbient(el) {
          ambientEl=el;
          if (!el) { ambientCtx=null; return; }
          const dpr=Math.min(window.devicePixelRatio||1,2);
          AW=Math.round((el.offsetWidth||el.clientWidth||400)*dpr);
          AH=Math.round((el.offsetHeight||el.clientHeight||400)*dpr);
          el.width=AW; el.height=AH; ambientCtx=el.getContext('2d');
        },
        /* Swap target canvas without resetting animation state — seamless blob continuity. */
        transferTo(el) {
          const dpr=Math.min(window.devicePixelRatio||1,2);
          const newBW=Math.round((el.offsetWidth||el.clientWidth||140)*dpr);
          el.width=el.height=newBW;
          blobEl=el; BW=newBW; blobCtx=el.getContext('2d');
        },
        setPreset(preset,duration) {
          duration=duration||800;
          fromP=fadeT<1?lerpPreset(fromP,toP,fadeT):toP; toP=preset;
          if(duration===0){fadeT=1;fromP=preset;}else{fadeT=0;fadeDur=duration;}
        }
      };
    }());

    /* Start onboarding blob + glow */
    setTimeout(() => {
      window.TAvatar.mountAmbient(document.getElementById('ob-glow'));
      window.TAvatar.mount(document.getElementById('ob-blob'));
    }, 50);

    /* ── Config fetch — starts immediately in background ── */
    let configReady = false;
    let configResult = null;
    const configWaiters = [];

    function waitForConfig() {
      if (configReady) return Promise.resolve(configResult);
      return new Promise(resolve => configWaiters.push(resolve));
    }

    (async function fetchConfig() {
      try {
        const res = await fetch(FETCH_CONFIG_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}'
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        configResult = await res.json();
      } catch (e) {
        configResult = { _error: e.message };
      }
      configReady = true;
      configWaiters.forEach(r => r(configResult));
      configWaiters.length = 0;
    })();

    /* ── Onboarding submit ── */
    async function submitOnboarding() {
      const nameEl  = document.getElementById('ob-name');
      const name    = nameEl.value.trim();
      const email   = document.getElementById('ob-email').value.trim();
      if (!name) { nameEl.focus(); return; }

      // Animate out onboarding, show loading
      document.getElementById('ob-screen').classList.add('out');
      const ldText = document.getElementById('ld-text');
      ldText.textContent = `Loading ${name}'s demo...`;
      document.getElementById('ld-screen').classList.add('active');

      // Wait for config (may already be ready)
      const config = await waitForConfig();

      if (config._error) {
        showError('Could not load demo: ' + config._error);
        return;
      }

      // Apply design tokens
      for (const [k, v] of Object.entries(config.tokens || {})) {
        if (v) document.documentElement.style.setProperty(`--${k}`, v);
      }

      // Store runtime vars + session
      config._chatUrl  = config.config_vars?.chat_endpoint || '';
      config._llmModel = config.config_vars?.llm_model || 'us.anthropic.claude-sonnet-4-5-20250929-v1:0';
      config._session  = {
        name: name.charAt(0).toUpperCase() + name.slice(1),
        email
      };

      // Inject component CSS
      for (const [compName, comp] of Object.entries(config.components || {})) {
        if (comp.css) {
          const style = document.createElement('style');
          style.dataset.component = compName;
          style.textContent = comp.css;
          document.head.appendChild(style);
        }
      }

      // Execute component JS
      window.Components = {};
      const compErrors = [];
      for (const [compName, comp] of Object.entries(config.components || {})) {
        if (comp.js) {
          try {
            new Function('Components', comp.js)(window.Components);
          } catch (e) {
            compErrors.push(compName + ': ' + e.message + ' (JS len=' + comp.js.length + ' first80=' + comp.js.substring(0, 80).replace(/\n/g, '\\n') + ')');
          }
        }
      }
      if (compErrors.length) {
        showError('Component error(s): ' + compErrors.join('\n'));
        return;
      }

      // Clean up onboarding/loading, show home
      document.getElementById('ob-screen').remove();
      document.getElementById('ld-screen').remove();

      const steps = config.steps || {};
      const first = Object.values(steps).sort((a, b) => (a.step_number || 0) - (b.step_number || 0))[0];
      if (first) renderStep(first, config, steps);
      else showError('No steps found in config');
    }

    document.getElementById('ob-btn').addEventListener('click', submitOnboarding);
    document.getElementById('ob-name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('ob-email').focus(); });
    document.getElementById('ob-email').addEventListener('keydown', e => { if (e.key === 'Enter') submitOnboarding(); });

    /* ── Helpers ── */
    function showError(msg) {
      const app = document.getElementById('app');
      const e = document.createElement('div');
      e.style.cssText = 'position:absolute;inset:0;background:#1F0E41;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:12px;z-index:9999;';
      const title = document.createElement('p');
      title.style.cssText = 'color:rgba(255,100,100,0.9);font-size:13px;font-weight:600;text-align:center';
      title.textContent = 'Demo error';
      const body = document.createElement('p');
      body.style.cssText = 'color:rgba(255,255,255,0.6);font-size:11px;text-align:center;word-break:break-all;line-height:1.5;max-width:320px';
      body.textContent = String(msg);
      e.appendChild(title);
      e.appendChild(body);
      app.appendChild(e);
    }

    function renderStep(step, config, allSteps) {
      const componentName = step.component || step.type;
      const Component = window.Components?.[componentName];
      if (!Component) {
        showError('No component: "' + componentName + '". Registered: ' + Object.keys(window.Components || {}).join(', '));
        return;
      }
      try {
        Component.render(
          document.getElementById('app'),
          step,
          config,
          allSteps,
          (nextStepId) => {
            const next = allSteps[nextStepId];
            if (next) renderStep(next, config, allSteps);
          }
        );
      } catch (err) {
        showError(componentName + ' render error: ' + err.message);
      }
    }
  </script>
</body>
</html>
